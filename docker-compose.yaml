services:
  chatbot-api:
    profiles: ['default', 'no-db', 'no-is']
    container_name: chatbot_api
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      # keycloak:
      #   condition: service_healthy
      #   restart: true
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_PORT}/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - chatbot
    
  postgres:
    profiles: ['default', 'no-is']
    container_name: postgres_chatbot
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "port=${POSTGRES_PORT}"]
    ports:
      - "${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot
    
  keycloak:
    profiles: ["default"]
    image: quay.io/keycloak/keycloak:23.0.4
    container_name: keycloak_chatbot
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:${POSTGRES_PORT}/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_SERVER_URL}

      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/${KEYCLOAK_PORT}; \
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; \
          if [ $? -eq 0 ]; then exit 0; else exit 1; fi"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - chatbot
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    command:
      - start-dev
      - --http-port=${KEYCLOAK_PORT}
      - --import-realm
      
volumes:
  postgres_data:
networks:
  chatbot:
    name: chatbot
    driver: bridge
services:
  chatbot-api:
    profiles: ['default', 'no-db']
    container_name: chatbot_api
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      keycloak:
        condition: service_healthy
        restart: true
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SKILL_EVALUATOR_OBSERVABILITY_DIR: /project/app/artifacts/observability
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_PORT}/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./artifacts:/project/app/artifacts
    networks:
      - chatbot_network
    
  postgres:
    profiles: ['default']
    container_name: postgres_chatbot
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_network
    
  keycloak:
    profiles: ["default"]
    image: quay.io/keycloak/keycloak:23.0.4
    container_name: keycloak_chatbot
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_SERVER_URL}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/${KEYCLOAK_PORT}; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; if [ $? -eq 0 ]; then exit 0; else exit 1; fi"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    command:
      - start-dev
      - --http-port=${KEYCLOAK_PORT}
      - --import-realm
    networks:
      - chatbot_network

networks:
  chatbot_network:
    driver: bridge
      
volumes:
  postgres_data:

services:
  chatbot-api:
    profiles: ['default', 'no-db']
    container_name: chatbot_api
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"
    networks:
      - chatbot
    
  postgres:
    profiles: ['default']
    container_name: postgres_chatbot
    hostname: assessment
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot
      
volumes:
  postgres_data:

networks:
  chatbot:
    driver: bridge
    name: chatbot

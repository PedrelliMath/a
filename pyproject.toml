[project]
name = "assessment_chat_bot"
version = "0.1.0"
description = "Api para orquestração de agentes de IA"
authors = [
    {name = "Matheus Mauricio", email = "lhr3@hotmail.com"},
]
dependencies = ["pydantic-settings>=2.11.0", "pydantic>=2.12.0", "sqlalchemy>=2.0.44", "fastapi[standard]>=0.119.0", "uvicorn>=0.37.0", "psycopg2-binary>=2.9.11", "openai>=2.6.1", "pydantic-ai>=1.9.1", "python-jose>=3.5.0", "pandas>=2.2"]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pdm.scripts]
test = "pytest"
lint = "ruff check src scripts tests"
format = "ruff format src scripts tests"
check-bank = "python scripts/validate_question_bank.py"
check-bias = "python scripts/check_verbosity_bias.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# `src/` carrega a base v1 que a reconstrução v2 vai substituir (ver docs/ROADMAP.md).
# O lint entra progressivamente: por ora trava o que é erro real, não estilo.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
